[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlite-mcp-server"
version = "0.1.0"
description = "A read-only SQLite MCP server built on the official MCP Python SDK."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sqlite-mcp-server = "sqlite_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
